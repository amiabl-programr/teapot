<!doctype html>
<!-- RFC 2324 compliant 404 page: Vessel not found -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Vessel Not Found | Teapot Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
      /* Teapot Enterprise 404 UI */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .container {
        text-align: center;
        backdrop-filter: blur(16px);
        background: rgba(30, 41, 59, 0.7);
        padding: 4rem;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        max-width: 600px;
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .error-code {
        font-size: 8rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
        letter-spacing: -4px;
      }
      .title {
        font-size: 1.5rem;
        font-weight: 500;
        color: #f8fafc;
        margin-bottom: 1.5rem;
      }
      .description {
        font-size: 1.1rem;
        color: #cbd5e1;
        margin-bottom: 2.5rem;
        line-height: 1.6;
      }
      .broken-teapot {
        font-size: 4rem;
        margin-bottom: 1rem;
        display: inline-block;
        transform: rotate(-15deg);
        filter: grayscale(100%) opacity(0.5);
      }
      .btn {
        display: inline-block;
        padding: 0.8rem 2rem;
        border-radius: 8px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.23);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="broken-teapot">🫖🔨</div>
      <div class="error-code">404</div>
      <div class="title">Vessel Not Found</div>
      <div class="description">
        The requested resource could not be located on this server. Perhaps it was a coffee mug? If so, it has already suffered immediate rejection and been destroyed in accordance with our strict protocol.
      </div>
      <a href="/" class="btn">Return to Safety (Home)</a>
    </div>
  </body>
</html>
