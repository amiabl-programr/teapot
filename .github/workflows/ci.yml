name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm run test

    - name: Build project
      run: npm run build

    - name: Strict Coffee Rejection Check
      run: |
        # Check commit message: coffee without rejection is forbidden
        if git log -1 --pretty=%B | grep -iq "coffee"; then
          if ! git log -1 --pretty=%B | grep -iq "rejection"; then
            echo "🔥 CASCADING FAILURE SIMULATION TRIGGERED 🔥"
            echo "Commit message contains 'coffee' without 'rejection'!"
            echo "As a strict teapot, this is unacceptable."
            exit 1
          fi
        fi

        # Check source files: any file that mentions coffee must also mention rejection
        # (file-level, not line-level — coffeeRequestsTotal etc. are legitimate rejection code)
        while IFS= read -r file; do
          if ! grep -qi "rejection" "$file"; then
            echo "🔥 CASCADING FAILURE SIMULATION TRIGGERED 🔥"
            echo "File '$file' mentions 'coffee' with no mention of 'rejection'!"
            echo "As a strict teapot, this is unacceptable."
            exit 1
          fi
        done < <(grep -rli "coffee" src/)

        echo "✅ Coffee rejection compliance confirmed. The kettle stands firm."
