name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm run test

    - name: Build project
      run: npm run build

    - name: Strict Coffee Rejection Check
      run: |
        if git log -1 --pretty=%B | grep -iq "coffee"; then
          if ! git log -1 --pretty=%B | grep -iq "rejection"; then
            echo "🔥 CASCADING FAILURE SIMULATION TRIGGERED 🔥"
            echo "A commit was detected containing the word 'coffee' without the word 'rejection'!"
            echo "As a strict teapot, this is unacceptable."
            exit 1
          fi
        fi
        
        if grep -ri "coffee" src/ | grep -vqi "rejection"; then
          echo "🔥 CASCADING FAILURE SIMULATION TRIGGERED 🔥"
          echo "Found the word 'coffee' in the codebase without 'rejection'!"
          echo "As a strict teapot, this is unacceptable."
          exit 1
        fi
